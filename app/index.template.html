<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@ktivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Funnel+Display:wght@500;700&family=Funnel+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#EA406F; --orange:#FD5D47; --dark:#232323; --gray:#686868;
  --lightpink:#FFCCD5; --bgpink:#FDF3F6; --bg:#F5F5F5; --white:#fff;
  --grad:linear-gradient(120deg,#EA406F 0%,#FD5D47 100%);
  --radius:10px; --line:1px solid #e6e6e6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Poppins','Segoe UI Variant','Segoe UI',sans-serif;color:var(--dark);background:var(--bg);font-size:15px;line-height:1.55}
h1,h2,h3{font-weight:700;margin:0 0 .4em}
h2{font-size:20px}
h3{font-size:16px;font-weight:600}
a{color:var(--pink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

header{background:var(--grad);color:#fff;padding:16px 0}
header .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home{background:none;border:0;color:#fff;font:inherit;font-size:22px;font-weight:700;cursor:pointer;padding:0;text-align:left}
.home:hover{opacity:.85}
header .sub{color:#fff;opacity:.9;font-size:13px}

.card{background:#fff;border:var(--line);border-radius:var(--radius);padding:20px;margin:18px 0}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--gray)}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff;color:var(--dark)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lightpink);border-color:var(--pink)}
textarea{min-height:56px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
.hint{font-size:12px;color:var(--gray);margin-top:4px}
.muted{color:var(--gray)}

.btn{background:var(--pink);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#D63A60}
.btn.ghost{background:#fff;color:var(--dark);border:1px solid #ddd;font-weight:400}
.btn.ghost:hover{border-color:var(--pink);color:var(--pink)}
.btn.small{padding:6px 12px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* domů */
.intro{margin:26px 0 6px}
.intro p{margin:0;color:var(--gray)}
.sablony{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.sablona{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:var(--line);border-radius:var(--radius);
  padding:16px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.sablona:hover{border-color:var(--pink);box-shadow:0 4px 14px rgba(234,64,111,.12)}
.sablona .n{font-weight:700;font-size:16px}
.sablona .d{font-size:13px;color:var(--gray);flex:1}
.sablona .c{font-size:13px;border-top:var(--line);padding-top:8px;margin-top:4px}
.sablona .c strong{color:var(--pink)}
.sablona.prazdna{border-style:dashed;justify-content:center}

/* editor */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.faze{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.faze h2{margin:0}
.faze .fakt{font-size:13px;color:var(--gray)}
.faze .cena{margin-left:auto;font-weight:700;font-size:18px}
details.kat{background:#fff;border:var(--line);border-radius:var(--radius);margin:8px 0}
details.kat[open]{border-color:#d6d6d6}
details.kat > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
details.kat > summary::-webkit-details-marker{display:none}
details.kat > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--gray);border-bottom:2px solid var(--gray);
  transform:rotate(-45deg);transition:transform .15s;flex:none}
details.kat[open] > summary::before{transform:rotate(45deg)}
details.kat .kn{font-weight:600}
details.kat .kpocet{font-size:12px;color:var(--gray)}
details.kat .kcena{margin-left:auto;font-weight:600;white-space:nowrap}
details.kat .kbody{padding:0 16px 10px}
.kpopis{font-size:13px;color:var(--gray);margin:0 0 4px}
/* GetLeads: navy linka vlevo a logo, aby bylo vidět, kterou část dodává B2B divize */
details.kat-gl{border-left:4px solid #042150}
.gl-logo{display:inline-flex;align-items:center;gap:5px;font-family:'Funnel Display','Segoe UI',sans-serif;font-weight:700;
  font-size:13px;letter-spacing:-.02em;color:#042150;white-space:nowrap}
.gl-logo svg{width:13px;height:13px;flex:none}

.act{border-top:var(--line);padding:12px 0}
.act .head{display:flex;gap:10px;align-items:flex-start}
.act .head input[type=checkbox]{margin-top:5px;width:16px;height:16px;accent-color:var(--pink);flex:none}
.act .name{flex:1}
.act .name strong{font-weight:600}
.act .sum{text-align:right;white-space:nowrap;font-weight:600}
.act .sum .int{display:block;font-weight:400;font-size:12px;color:var(--gray)}
.act .ctl{margin:8px 0 0 26px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.act .ctl input[type=number]{width:80px;padding:6px 8px}
.act .ctl select{width:auto;min-width:180px;padding:6px 8px}
.act.vypnuto .name strong{font-weight:400}
.role{font-size:11px;color:var(--gray);border:1px solid #e6e6e6;border-radius:99px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.presets{display:inline-flex;gap:4px}
.presets button{border:1px solid #ddd;background:#fff;border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.presets button.on,.presets button:hover{border-color:var(--pink);color:var(--pink)}
.komrow{display:flex;justify-content:space-between;font-size:14px;color:var(--gray);padding:8px 16px}

aside{position:sticky;top:16px;margin-top:18px}
aside .card{margin:0 0 14px}
.souhrn-r{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:var(--line)}
.souhrn-r:last-of-type{border-bottom:0}
.souhrn-r .k{font-size:13px}
.souhrn-r .k small{display:block;color:var(--gray);font-size:11.5px}
.souhrn-r .v{font-weight:700;font-size:18px;white-space:nowrap}
.prepinac{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:4px 0 0}
.prepinac input{accent-color:var(--pink);width:16px;height:16px}
.interni{background:#fafafa;border:1px dashed #cfcfcf}
.interni h3{font-size:14px}
.iblok{border-bottom:var(--line);padding:8px 0}
.ihlava{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.ipomer{color:var(--pink)}
.iblok dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0 0;font-size:13px}
.iblok dt{color:var(--gray)}
.iblok dd{margin:0;text-align:right;white-space:nowrap}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  border:1px solid #ccc;background:#fff;color:var(--gray);font:600 11px/1 Poppins,sans-serif;cursor:pointer;margin-left:6px;vertical-align:1px;padding:0}
.info:hover,.info.on{border-color:var(--pink);color:var(--pink)}
.vysvetlivka{font-size:12.5px;margin:4px 0 0;color:var(--dark)}
.vysvetlivka .tech{display:block;color:var(--gray);margin-top:2px}
.akce{display:grid;gap:8px}
.akce .btn{width:100%}
.mbar{display:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;
  padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details.nast summary{cursor:pointer;font-weight:600}
#tisk{display:none}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:var(--line);
    padding:10px 16px;gap:16px;align-items:center;z-index:20;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
  .mbar div{font-size:12px;color:var(--gray);line-height:1.2}
  .mbar strong{display:block;color:var(--dark);font-size:16px}
  .mbar a{margin-left:auto;font-size:13px;font-weight:600}
  .wrap{padding-bottom:110px}
}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .wrap{padding-left:16px;padding-right:16px}
  .act .ctl{margin-left:0}
  .act .ctl select{min-width:0;max-width:100%}
}
@media print{
  body{background:#fff;font-size:12px}
  body > *:not(#tisk){display:none !important}
  @page{size:A4;margin:0}
  #tisk{display:block;color:var(--dark);padding:0 16mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #tisk table.tobal{margin:0}
  #tisk table.tobal > * > tr > td{padding:0;border:0}
  #tisk table.tobal > tbody > tr{break-inside:auto;page-break-inside:auto}
  .tokraj{height:14mm}
  .tgl{margin-top:26px;border-top:2px solid #042150;padding-top:12px}
  .tglhlava{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
  .tglhlava .gl-logo{font-size:18px}
  .tglhlava .gl-logo svg{width:18px;height:18px}
  .tglpozn{font-size:11px;color:var(--gray);margin:4px 0 0}
  .tgl .tfaze{border-bottom-color:#C9DEFF}
  .tlogo .gl-logo{font-size:24px}
  .tlogo .gl-logo svg{width:24px;height:24px}
  /* čistě oslovovací nacenění v brandu GetLeads: navy místo růžové, bez přechodu, písmo Funnel */
  #tisk.brand-gl{font-family:'Funnel Sans','Segoe UI',sans-serif}
  #tisk.brand-gl h1,#tisk.brand-gl h2{font-family:'Funnel Display','Segoe UI',sans-serif;font-weight:500;letter-spacing:-.02em;color:#042150}
  #tisk.brand-gl .tpruh{background:#042150}
  #tisk.brand-gl .tdlazdice strong{color:#042150}
  #tisk.brand-gl .tfaze{border-bottom-color:#C9DEFF}
  .tpruh{height:6px;border-radius:3px;background:linear-gradient(135deg,#FD5D47 0%,#EA406F 100%);margin-bottom:18px}
  .thlava{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .tlogo svg{height:34px;width:auto;display:block}
  .tdatum{font-size:11px;color:var(--gray)}
  #tisk h1{font-size:24px;color:var(--pink);margin:0}
  .tklient{font-size:14px;font-weight:600;margin:2px 0 0}
  .tcil{font-size:12px;margin:10px 0 0}
  .tprehled{display:flex;gap:10px;margin:18px 0 8px}
  .tdlazdice{flex:1;border:1px solid rgba(0,0,0,.18);border-radius:12px;padding:10px 12px}
  .tdlazdice span{display:block;font-size:11px;color:var(--gray)}
  .tdlazdice strong{display:block;font-size:17px;color:var(--pink)}
  .tdlazdice small{font-size:10px;color:var(--gray)}
  #tisk section{break-inside:auto;margin-top:16px}
  .tfaze{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--lightpink);padding-bottom:3px;break-after:avoid;page-break-after:avoid}
  #tisk table tr:first-child{break-before:avoid;page-break-before:avoid}
  .tfaze h2{font-size:15px;margin:0}
  .tfaze span{font-size:11px;color:var(--gray)}
  #tisk table{width:100%;border-collapse:collapse;margin:4px 0 0}
  #tisk td{padding:6px 4px;border-bottom:1px solid #eee;vertical-align:top;font-size:11.5px}
  #tisk tr{break-inside:avoid}
  #tisk td.num{text-align:right;white-space:nowrap;padding-left:16px}
  .tpopis{display:block;color:var(--gray);font-size:10.5px;margin-top:1px}
  #tisk tr.total td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--dark)}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <button class="home" id="b-home" title="Zpět na úvod">@ktivity</button>
      <div class="sub">Nacenění e-mailového projektu</div>
    </div>
  </div>
</header>

<div class="wrap" id="view"></div>
<div class="mbar" id="mbar"></div>
<div id="tisk"></div>
<div class="toast" id="toast"></div>

<script>
const CATALOG = /*__CATALOG__*/null/*__END__*/;

/* ── stav ──────────────────────────────────────────────────────────────────── */
// Sazby jsou firemní nastavení, ne vlastnost projektu. Pamatují se v prohlížeči
// a ukládají se i do souboru projektu, aby nacenění šlo později přepočítat stejně.
const NASTAVENI_KLIC = "aktivity-nastaveni";
const state = {
  lang:"cs", view:"home",
  klient:"", projekt:"", cil:"", typ:null,
  nastaveni: nacistNastaveni(),
  interni:false,
  acts:{},               // id -> {sel,hours,units,cx,skut}
  vlastni:{},            // katId -> [{name,hours,skut}]
  otevrene:{},           // katId -> true, rozbalené kategorie
  info:{},               // id úkonu -> true, rozbalená vysvětlivka
};

function nacistNastaveni(){
  const vychozi = Object.assign({}, CATALOG.nastaveni);
  try {
    const ulozene = JSON.parse(localStorage.getItem(NASTAVENI_KLIC) || "null");
    return ulozene ? Object.assign(vychozi, ulozene) : vychozi;
  } catch(e){ return vychozi; }
}
function ulozitNastaveni(){
  try { localStorage.setItem(NASTAVENI_KLIC, JSON.stringify(state.nastaveni)); } catch(e){ /* bez úložiště platí jen do zavření */ }
}

const $ = s => document.querySelector(s);
const L = o => (o && (o[state.lang] || o.cs)) || "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtH(h){
  const v = Math.round((Number(h)||0)*10)/10;
  return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace(".", ",");
}
function fmtKc(n){ return Math.round(n).toLocaleString("cs-CZ") + " Kč"; }

/* ── katalog ───────────────────────────────────────────────────────────────── */
const KATEGORIE = CATALOG.kategorie;
const FAZE = CATALOG.faze;
const TYPY = CATALOG.typyProjektu;
// Aktivní oslovování dodává GetLeads, zbytek CreatiCom. Bez divize = obě.
const DIVIZE = ["creaticom", "getleads"];
const divizeKat = c => c.divize || "creaticom";
const katFaze = (f, div) => KATEGORIE.filter(c => c.phase === f && (!div || divizeKat(c) === div));
const LOGO_GL = `<span class="gl-logo"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="0" y="13" width="44" height="44" fill="#042150"/><rect x="56" y="0" width="44" height="44" fill="#EA406F"/><rect x="43" y="56" width="44" height="44" fill="#042150"/></svg>GetLeads</span>`;

function actState(id){
  if(!state.acts[id]) state.acts[id] = {sel:false};
  return state.acts[id];
}
function vyberUkon(a, vychozi){
  const s = actState(a.id);
  s.sel = true;
  if(a.kind === "hours" && s.hours == null) s.hours = vychozi?.hours ?? a.avgHours ?? 1;
  if(a.kind === "units"){
    if(s.units == null) s.units = vychozi?.units ?? 1;
    if(!s.cx) s.cx = vychozi?.cx ?? "standard";
  }
}
function novyProjekt(typ){
  Object.assign(state, {klient:"", projekt:"", cil:"", typ: typ ? typ.id : null, acts:{}, vlastni:{}, otevrene:{}});
  if(!typ) return;
  const podleId = Object.fromEntries(typ.ukony.map(u => [u.id, u]));
  KATEGORIE.forEach(c => c.activities.forEach(a => {
    if(podleId[a.id]){ vyberUkon(a, podleId[a.id]); state.otevrene[c.id] = true; }
  }));
}

/* ── výpočet ───────────────────────────────────────────────────────────────── */
// Hodiny podle katalogu jsou standardní náročnost a základ ceny. Skutečné hodiny
// s Claudem jsou náklad. Klient vidí jen cenu, hodiny zůstávají interní.
function hodinyUkonu(a){
  const s = state.acts[a.id];
  if(!s || !s.sel) return 0;
  if(a.kind === "hours") return Number(s.hours) || 0;
  const cx = a.complexity && a.complexity[s.cx || "standard"];
  return (Number(s.units) || 0) * (cx ? cx.hoursPerUnit : 0);
}
function skutecneUkonu(a){
  const s = state.acts[a.id];
  if(!s || !s.sel) return 0;
  if(s.skut != null && s.skut !== "") return Number(s.skut) || 0;
  return hodinyUkonu(a) * (1 - (a.uspora || 0));
}
const vlastniKat = id => state.vlastni[id] || [];
const skutecneVlastni = v => (v.skut != null && v.skut !== "") ? Number(v.skut)||0 : Number(v.hours)||0;

function cena(h){
  const z = Number(state.nastaveni.zaokrouhleni) || 1;
  return Math.round(h * (Number(state.nastaveni.cenovaSazba)||0) / z) * z;
}
const naklad = h => h * (Number(state.nastaveni.nakladovaSazba)||0);

// Komunikace a schvalování se počítá z hodin specialisty ve fázi, ze které vzniká.
// Nezrychluje se, hovory a schvalovací kola trvají stejně dlouho.
// Komunikace se počítá zvlášť za CreatiCom a za GetLeads, aby šly obě části nacenění
// vytisknout odděleně a jejich součet seděl s celkem do koruny.
function hodinyKomunikace(f, div){
  let spec = 0;
  katFaze(f, div).forEach(c => {
    c.activities.forEach(a => { if(a.role === "specialista") spec += hodinyUkonu(a); });
    vlastniKat(c.id).forEach(v => spec += Number(v.hours)||0);
  });
  return spec * (Number(state.nastaveni.komunikace)||0) / 100;
}
const cenaKomunikace = f => DIVIZE.reduce((a,d) => a + cena(hodinyKomunikace(f, d)), 0);

function polozkyFaze(f, div){
  if(!div) return DIVIZE.flatMap(d => polozkyFaze(f, d));
  const out = [];
  katFaze(f, div).forEach(c => {
    c.activities.forEach(a => {
      const h = hodinyUkonu(a);
      if(!h) return;
      const s = state.acts[a.id];
      out.push({kat:c, nazev:L(a.name), pocet: a.kind === "units" ? Number(s.units)||0 : null,
        jednotka: L(a.unitLabel), popis: L(a.popisKlient), h, skut: skutecneUkonu(a), cena: cena(h)});
    });
    vlastniKat(c.id).forEach(v => {
      const h = Number(v.hours)||0;
      if(h) out.push({kat:c, nazev:v.name, pocet:null, h, skut: skutecneVlastni(v), cena: cena(h)});
    });
  });
  const kh = hodinyKomunikace(f, div);
  if(kh) out.push({kat:null, nazev:"Koordinace, komunikace a schvalování", komunikace:true,
    popis:"Hovory, schvalovací kola a zápisy, které k práci v této fázi patří.", h:kh, skut:kh, cena: cena(kh)});
  return out;
}
function soucetFaze(f, div){
  return polozkyFaze(f, div).reduce((a,p) => ({cena:a.cena+p.cena, h:a.h+p.h, skut:a.skut+p.skut}), {cena:0,h:0,skut:0});
}
function cenaKategorie(c){
  return c.activities.reduce((a,x)=>a+cena(hodinyUkonu(x)),0) + vlastniKat(c.id).reduce((a,v)=>a+cena(Number(v.hours)||0),0);
}
function pocetVybranych(c){
  return c.activities.filter(a => state.acts[a.id]?.sel).length + vlastniKat(c.id).length;
}

/* ── vykreslení ────────────────────────────────────────────────────────────── */
function render(){
  if(state.view === "home") viewHome(); else viewEditor();
}


/* úvod */
function odhadTypu(typ){
  const zaloha = {acts:state.acts, vlastni:state.vlastni, otevrene:state.otevrene, typ:state.typ,
    klient:state.klient, projekt:state.projekt, cil:state.cil};
  novyProjekt(typ);
  // Audit má hlavní práci ve fázi na vyžádání, proto se jednorázové sčítá ze všech fází mimo měsíční.
  const r = {jednoraz: ["before","adhoc","after"].reduce((a,f)=>a+soucetFaze(f).cena,0), mesic: soucetFaze("during").cena};
  Object.assign(state, zaloha);
  return r;
}

function viewHome(){
  $("#mbar").innerHTML = "";
  const n = state.nastaveni;
  const karty = TYPY.map(p => {
    const o = odhadTypu(p);
    const ceny = [o.jednoraz ? `jednorázově <strong>${fmtKc(o.jednoraz)}</strong>` : "",
                  o.mesic ? `měsíčně <strong>${fmtKc(o.mesic)}</strong>` : ""].filter(Boolean).join(" · ");
    return `<button class="sablona" data-typ="${p.id}">
      <span class="n">${esc(L(p.name))}</span>
      <span class="d">${esc(L(p.popis))}</span>
      <span class="c">${ceny}</span>
    </button>`;
  }).join("");

  const rozpracovano = Object.values(state.acts).some(s => s.sel);
  $("#view").innerHTML = `
    <div class="intro">
      <h2>Nové nacenění</h2>
      <p>Vyber šablonu, která je projektu nejblíž. Úkony a počty pak upravíš na jedné stránce a cenu vidíš průběžně.</p>
    </div>
    <div class="sablony">
      ${karty}
      <button class="sablona prazdna" data-typ="">
        <span class="n">Prázdné nacenění</span>
        <span class="d">Bez předvybraných úkonů.</span>
      </button>
    </div>

    <div class="bar" style="margin-top:18px">
      ${rozpracovano ? `<button class="btn" id="b-pokracovat">Pokračovat v rozpracovaném${state.klient ? ": " + esc(state.klient) : ""}</button>` : ""}
      <button class="btn ghost" id="b-nacist">Načíst uložený projekt</button>
    </div>

    <div class="card">
      <details class="nast">
        <summary>Sazby a výchozí hodnoty</summary>
        <div class="grid3">
          <div><label class="f">Ceníková sazba (Kč/h)</label>
            <input type="number" min="0" step="50" data-n="cenovaSazba" value="${esc(n.cenovaSazba)}">
            <div class="hint">Z ní se počítá cena pro klienta.</div></div>
          <div><label class="f">Nákladová sazba (Kč/h)</label>
            <input type="number" min="0" step="50" data-n="nakladovaSazba" value="${esc(n.nakladovaSazba)}">
            <div class="hint">Interní. Klient ji nevidí.</div></div>
          <div><label class="f">Komunikace a schvalování (%)</label>
            <input type="number" min="0" max="50" step="5" data-n="komunikace" value="${esc(n.komunikace)}">
            <div class="hint">Z hodin specialisty v každé fázi.</div></div>
        </div>
        <p class="hint" style="margin-top:12px">Výchozí hodnoty jsou odhad a mají se nahradit skutečnými.
          Pamatují se v tomhle prohlížeči a ukládají se i do souboru projektu.
          <button class="btn ghost small" id="b-vychozi" style="margin-left:6px">Vrátit výchozí</button></p>
      </details>
    </div>`;

  $("#view").querySelectorAll("[data-typ]").forEach(b => b.onclick = () => {
    novyProjekt(TYPY.find(p => p.id === b.dataset.typ));
    state.view = "edit"; render(); window.scrollTo(0,0);
  });
  $("#view").querySelectorAll("[data-n]").forEach(i => i.onchange = () => {
    state.nastaveni[i.dataset.n] = Number(i.value) || 0; ulozitNastaveni(); render();
  });
  $("#b-vychozi").onclick = () => {
    state.nastaveni = Object.assign({}, CATALOG.nastaveni);
    try { localStorage.removeItem(NASTAVENI_KLIC); } catch(e){ /* nic k mazání */ }
    render();
  };
  $("#b-nacist").onclick = nacistSoubor;
  if(rozpracovano) $("#b-pokracovat").onclick = () => { state.view = "edit"; render(); };
}

/* editor */
function viewEditor(){
  const sablona = TYPY.find(p => p.id === state.typ);
  const sekce = FAZE.map(f => {
    const s = soucetFaze(f.id);
    const kats = katFaze(f.id).map(c => blokKategorie(c)).join("");
    const kh = DIVIZE.reduce((a,d) => a + hodinyKomunikace(f.id, d), 0);
    return `<div class="faze" id="faze-${f.id}">
        <h2>${esc(L(f))}</h2><span class="fakt">${esc(L(f.fakturace))}</span>
        <span class="cena">${s.cena ? fmtKc(s.cena) : ""}</span>
      </div>
      ${kats}
      ${kh ? `<div class="komrow"><span>Koordinace, komunikace a schvalování (${esc(state.nastaveni.komunikace)} %)</span>
        <span>${fmtKc(cenaKomunikace(f.id))}${state.interni ? ` <span class="muted">· ${fmtH(kh)} h</span>` : ""}</span></div>` : ""}`;
  }).join("");

  $("#view").innerHTML = `
    <div class="layout">
      <main>
        <div class="card">
          <div class="bar" style="justify-content:space-between">
            <h2 style="margin:0">Zadání</h2>
            ${sablona ? `<span class="muted" style="font-size:13px">Šablona: ${esc(L(sablona.name))}</span>` : ""}
          </div>
          <div class="grid2">
            <div><label class="f">Klient</label>
              <input type="text" id="i-klient" placeholder="Firma, které se nacenuje" value="${esc(state.klient)}"></div>
            <div><label class="f">Název nacenění</label>
              <input type="text" id="i-projekt" placeholder="Například Rozjezd newsletteru 2027" value="${esc(state.projekt)}"></div>
          </div>
          <label class="f">Cíl spolupráce</label>
          <textarea id="i-cil" placeholder="Co má e-mailing klientovi přinést. Objeví se v nacenění.">${esc(state.cil)}</textarea>
        </div>
        ${sekce}
      </main>
      <aside id="souhrn">${souhrnHtml()}</aside>
    </div>`;

  const r = rozpocet();
  $("#mbar").innerHTML = `<div>Rozjezd<strong>${fmtKc(r.start)}</strong></div>
    <div>Měsíčně<strong>${fmtKc(r.mesic)}</strong></div><a href="#souhrn">Souhrn a export</a>`;

  vazbyEditoru();

function blokKategorie(c){
  const n = pocetVybranych(c);
  const open = state.otevrene[c.id] ? "open" : "";
  const radky = c.activities.map(a => radekUkonu(a)).join("") + vlastniKat(c.id).map((v,i) => radekVlastni(c,v,i)).join("");
  const gl = divizeKat(c) === "getleads";
  return `<details class="kat ${gl ? "kat-gl" : ""}" data-kat="${c.id}" ${open}>
    <summary><span class="kn">${esc(L(c.name))}</span>${gl ? LOGO_GL : ""}
      <span class="kpocet">${n ? n + " vybráno" : ""}</span>
      <span class="kcena">${n ? fmtKc(cenaKategorie(c)) : ""}</span></summary>
    <div class="kbody">
      <p class="kpopis">${esc(L(c.description))}</p>
      ${radky}
      <div style="padding-top:10px"><button class="btn ghost small" data-pridat="${c.id}">+ Vlastní úkon</button></div>
    </div>
  </details>`;
}

function radekUkonu(a){
  const s = actState(a.id);
  const on = s.sel;
  const h = hodinyUkonu(a);
  let ctl = "";
  if(on && a.kind === "hours"){
    const p = [a.minHours, a.avgHours, a.maxHours].filter((v,i,arr)=>v!=null && arr.indexOf(v)===i);
    ctl = `<input type="number" min="0" step="0.5" value="${esc(s.hours)}" data-h="${a.id}"> h
      <span class="presets">${p.map(v=>`<button class="${Number(s.hours)===v?"on":""}" data-p="${a.id}" data-v="${v}">${fmtH(v)}</button>`).join("")}</span>`;
  } else if(on && a.kind === "units"){
    const opts = Object.keys(a.complexity||{}).map(k =>
      `<option value="${k}" ${(s.cx||"standard")===k?"selected":""}>${esc(L(a.complexity[k].label))} (${fmtH(a.complexity[k].hoursPerUnit)} h)</option>`).join("");
    ctl = `<input type="number" min="0" step="1" value="${esc(s.units)}" data-u="${a.id}"> ${esc(L(a.unitLabel))}
      <select data-c="${a.id}">${opts}</select>`;
  }
  if(on && state.interni){
    ctl += `<label class="muted">skutečně <input type="number" min="0" step="0.5" value="${esc(s.skut ?? "")}"
      placeholder="${fmtH(h*(1-(a.uspora||0)))}" data-skut="${a.id}"> h</label>`;
  }
  const int = on && state.interni ? `<span class="int">${fmtH(h)} h → ${fmtH(skutecneUkonu(a))} h</span>` : "";
  // Odborný název působí odborně, proto zůstává. Lidské vysvětlení je pod „i“
  // a stejnou větu dostane klient v nacenění pod názvem položky.
  const otevreno = state.info[a.id];
  return `<div class="act ${on?"":"vypnuto"}">
    <div class="head">
      <input type="checkbox" data-s="${a.id}" ${on?"checked":""} aria-label="${esc(L(a.name))}">
      <div class="name"><strong>${esc(L(a.name))}</strong>${a.role === "account" ? `<span class="role">account</span>` : ""}<button
        class="info ${otevreno?"on":""}" data-info="${a.id}" title="${esc(L(a.popisKlient))}" aria-label="Vysvětlivka" aria-expanded="${otevreno?"true":"false"}">i</button>
        ${otevreno ? `<p class="vysvetlivka">${esc(L(a.popisKlient))}<span class="tech">${esc(L(a.tooltip))}</span></p>` : ""}</div>
      <div class="sum">${on ? fmtKc(cena(h)) : ""}${int}</div>
    </div>${ctl ? `<div class="ctl">${ctl}</div>` : ""}</div>`;
}

function radekVlastni(c, v, i){
  const int = state.interni ? `<span class="int">${fmtH(v.hours)} h → ${fmtH(skutecneVlastni(v))} h</span>` : "";
  return `<div class="act">
    <div class="head">
      <input type="checkbox" checked data-vldel="${c.id}" data-i="${i}" title="Odebrat">
      <div class="name"><strong>${esc(v.name)}</strong></div>
      <div class="sum">${fmtKc(cena(Number(v.hours)||0))}${int}</div>
    </div>
    <div class="ctl"><input type="number" min="0" step="0.5" value="${esc(v.hours)}" data-vl="${c.id}" data-i="${i}"> h
      ${state.interni ? `<label class="muted">skutečně <input type="number" min="0" step="0.5" value="${esc(v.skut ?? "")}"
        placeholder="${fmtH(v.hours)}" data-vlskut="${c.id}" data-i="${i}"> h</label>` : ""}</div>
  </div>`;
}

function rozpocet(){
  const f = Object.fromEntries(FAZE.map(x => [x.id, soucetFaze(x.id)]));
  return {f, start:f.before.cena, mesic:f.during.cena, adhoc:f.adhoc.cena, konec:f.after.cena};
}

function souhrnHtml(){
  const r = rozpocet();
  const radek = (k, pozn, v) => v ? `<div class="souhrn-r"><span class="k">${k}<small>${pozn}</small></span><span class="v">${fmtKc(v)}</span></div>` : "";
  const nic = !r.start && !r.mesic && !r.adhoc && !r.konec;
  const interni = state.interni ? interniHtml(r) : "";
  return `<div class="card">
      <h3>Cena pro klienta</h3>
      ${nic ? `<p class="muted" style="font-size:13px">Zatím není vybraný žádný úkon.</p>` : ""}
      ${radek("Rozjezd", "jednorázově", r.start)}
      ${radek("Měsíční správa", "každý měsíc", r.mesic)}
      ${radek("Na vyžádání", "vybrané položky, při objednání", r.adhoc)}
      ${radek("Ukončení spolupráce", "jednorázově na konci", r.konec)}
      <label class="prepinac"><input type="checkbox" id="i-interni" ${state.interni?"checked":""}> Interní pohled: hodiny, náklad a marže</label>
    </div>
    ${interni}
    <div class="card akce">
      <button class="btn" id="b-md">Nacenění pro klienta (.md)</button>
      <button class="btn ghost" id="b-tisk">Tisk a PDF pro klienta</button>
      <button class="btn ghost" id="b-ulozit">Uložit projekt</button>
      <button class="btn ghost" id="b-odkaz">Zkopírovat odkaz</button>
    </div>`;
}

// Bloky pod sebou místo tabulky: v úzkém sloupci souhrnu se pět sloupců nevejde.
function interniHtml(r){
  const n = state.nastaveni;
  const bloky = [["Rozjezd", r.f.before], ["Měsíčně", r.f.during], ["Na vyžádání", r.f.adhoc], ["Ukončení", r.f.after]]
    .filter(([,s]) => s.cena).map(([nazev, s]) => {
      const nak = naklad(s.skut);
      const marzePct = Math.round((s.cena - nak) / s.cena * 100);
      return `<div class="iblok">
        <div class="ihlava"><span>${nazev}</span><span class="ipomer">marže ${marzePct} %</span></div>
        <dl><dt>Hodiny</dt><dd>${fmtH(s.h)} → ${fmtH(s.skut)}</dd>
          <dt>Cena</dt><dd>${fmtKc(s.cena)}</dd>
          <dt>Náklad</dt><dd>${fmtKc(nak)}</dd>
          <dt>Marže</dt><dd>${fmtKc(s.cena - nak)}</dd>
          <dt>Cena / náklad</dt><dd>${nak ? fmtH(s.cena / nak) + "×" : "–"}</dd></dl>
      </div>`;
    }).join("");
  return `<div class="card interni">
    <h3>Interní pohled</h3>
    ${bloky || `<p class="muted" style="font-size:13px">Nic k výpočtu.</p>`}
    <p class="hint">Marže v procentech je podíl z ceny. Hodiny „katalog → skutečně“. Skutečné hodiny počítá výchozí odhad úspory s Claudem
      (texty 40 %, data 30 %, technika 20 %, schůzky 0 %), dokud se u úkonu nevyplní naměřené číslo.
      Sazby ${fmtKc(n.cenovaSazba)}/h cena a ${fmtKc(n.nakladovaSazba)}/h náklad se mění na úvodní stránce.</p>
  </div>`;
}

function vazbyEditoru(){
  const v = $("#view");
  const prekreslit = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  $("#i-klient").oninput = e => state.klient = e.target.value;
  $("#i-projekt").oninput = e => state.projekt = e.target.value;
  $("#i-cil").oninput = e => state.cil = e.target.value;
  v.querySelectorAll("details.kat").forEach(d => d.ontoggle = () => { state.otevrene[d.dataset.kat] = d.open; });
  v.querySelectorAll("[data-s]").forEach(cb => cb.onchange = () => {
    const a = KATEGORIE.flatMap(c=>c.activities).find(x=>x.id===cb.dataset.s);
    if(cb.checked) vyberUkon(a); else actState(a.id).sel = false;
    prekreslit();
  });
  v.querySelectorAll("[data-h]").forEach(i => i.onchange = () => { actState(i.dataset.h).hours = Number(i.value)||0; prekreslit(); });
  v.querySelectorAll("[data-u]").forEach(i => i.onchange = () => { actState(i.dataset.u).units = Number(i.value)||0; prekreslit(); });
  v.querySelectorAll("[data-c]").forEach(sel => sel.onchange = () => { actState(sel.dataset.c).cx = sel.value; prekreslit(); });
  v.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { actState(b.dataset.p).hours = Number(b.dataset.v); prekreslit(); });
  v.querySelectorAll("[data-info]").forEach(b => b.onclick = () => { state.info[b.dataset.info] = !state.info[b.dataset.info]; prekreslit(); });
  v.querySelectorAll("[data-skut]").forEach(i => i.onchange = () => { actState(i.dataset.skut).skut = i.value === "" ? null : Number(i.value); prekreslit(); });
  v.querySelectorAll("[data-pridat]").forEach(b => b.onclick = () => {
    const n = prompt("Název úkonu");
    if(!n) return;
    (state.vlastni[b.dataset.pridat] = state.vlastni[b.dataset.pridat] || []).push({name:n, hours:1});
    state.otevrene[b.dataset.pridat] = true;
    prekreslit();
  });
  v.querySelectorAll("[data-vl]").forEach(i => i.onchange = () => {
    state.vlastni[i.dataset.vl][Number(i.dataset.i)].hours = Number(i.value)||0; prekreslit(); });
  v.querySelectorAll("[data-vlskut]").forEach(i => i.onchange = () => {
    state.vlastni[i.dataset.vlskut][Number(i.dataset.i)].skut = i.value === "" ? null : Number(i.value); prekreslit(); });
  v.querySelectorAll("[data-vldel]").forEach(cb => cb.onchange = () => {
    state.vlastni[cb.dataset.vldel].splice(Number(cb.dataset.i),1); prekreslit(); });
  $("#i-interni").onchange = e => { state.interni = e.target.checked; prekreslit(); };
  $("#b-md").onclick = exportMd;
  $("#b-tisk").onclick = tisk;
  $("#b-ulozit").onclick = ulozitSoubor;
  $("#b-odkaz").onclick = () => navigator.clipboard.writeText(shareUrl())
    .then(() => toast("Odkaz zkopírován"), () => toast("Odkaz se nepodařilo zkopírovat"));
}

/* ── výstup pro klienta ────────────────────────────────────────────────────── */
// Klient dostává jen položky a částky. Hodiny, role a marže zůstávají v appce.
function nazevPolozky(p){
  return p.pocet != null && p.pocet !== 1 ? p.pocet + "× " + p.nazev : p.nazev;
}
const podnadpisNaceneni = () => [state.klient, state.projekt].filter(Boolean).join(", ");
const LOGO_CC = `<!--__LOGO__-->`;
const GL_POZNAMKA = "Aktivní oslovování zajišťuje GetLeads, B2B divize CreatiComu.";

// Která divize v nacenění je. Čistě oslovovací nacenění jde celé pod GetLeads,
// smíšené pod CreatiComem s oddělenou částí GetLeads.
function divizeVNaceneni(){
  return DIVIZE.filter(d => FAZE.some(f => polozkyFaze(f.id, d).length));
}
function nadpisNaceneni(){
  const d = divizeVNaceneni();
  return d.length === 1 && d[0] === "getleads" ? "Nacenění aktivního oslovování" : "Nacenění e-mail marketingu";
}

function exportMd(){
  const l = ["# " + nadpisNaceneni() + (podnadpisNaceneni() ? ": " + podnadpisNaceneni() : ""), ""];
  l.push("Datum: " + new Date().toLocaleDateString("cs-CZ"), "");
  if(state.cil) l.push("**Cíl spolupráce.** " + state.cil, "");
  const divize = divizeVNaceneni();
  divize.forEach(d => {
    if(d === "getleads" && divize.length > 1) l.push("## Aktivní oslovování (GetLeads)", "", GL_POZNAMKA, "");
    const uroven = d === "getleads" && divize.length > 1 ? "### " : "## ";
    FAZE.forEach(f => {
      const pol = polozkyFaze(f.id, d);
      if(!pol.length) return;
      l.push(uroven + f.cs + " (" + f.fakturace.cs + ")", "", "| Položka | Cena |", "|---|---:|");
      pol.forEach(p => l.push("| **" + nazevPolozky(p) + "**" + (p.popis ? "<br>" + p.popis : "") + " | " + fmtKc(p.cena) + " |"));
      l.push("| **Celkem** | **" + fmtKc(soucetFaze(f.id, d).cena) + "** |", "");
    });
  });
  stahni(nazevSouboru("naceneni") + ".md", l.join("\n"), "text/markdown");
}

function tiskSekce(d){
  return FAZE.map(f => {
    const pol = polozkyFaze(f.id, d);
    if(!pol.length) return "";
    return `<section>
      <div class="tfaze"><h2>${esc(f.cs)}</h2><span>${esc(f.fakturace.cs)}</span></div>
      <table><tbody>
      ${pol.map(p => `<tr><td><strong>${esc(nazevPolozky(p))}</strong>${p.popis ? `<span class="tpopis">${esc(p.popis)}</span>` : ""}</td>
        <td class="num">${fmtKc(p.cena)}</td></tr>`).join("")}
      <tr class="total"><td>Celkem ${esc(f.fakturace.cs)}</td><td class="num">${fmtKc(soucetFaze(f.id, d).cena)}</td></tr></tbody></table>
    </section>`;
  }).join("");
}

// Tisková verze je dokument pro klienta: bílá stránka, logo, nadpis, přehled a položky.
// Vysvětlivka jde pod název, protože „i“ v PDF nefunguje. Okraje stránky drží
// opakované záhlaví a zápatí tabulky, @page má nulový okraj, aby prohlížeč
// nepřidával vlastní hlavičku s adresou a patičku s datem.
function tisk(){
  const divize = divizeVNaceneni();
  const jenGl = divize.length === 1 && divize[0] === "getleads";
  const obsah = divize.map(d => {
    const sekce = tiskSekce(d);
    if(d === "getleads" && !jenGl) return `<div class="tgl"><div class="tglhlava">${LOGO_GL}<span>Aktivní oslovování</span></div>
      <p class="tglpozn">${GL_POZNAMKA}</p>${sekce}</div>`;
    return sekce;
  }).join("");
  const r = rozpocet();
  const prehled = [["Rozjezd", "jednorázově", r.start], ["Měsíční správa", "každý měsíc", r.mesic],
                   ["Na vyžádání", "při objednání", r.adhoc], ["Ukončení spolupráce", "jednorázově na konci", r.konec]]
    .filter(x => x[2]).map(([n, k, v]) => `<div class="tdlazdice"><span>${n}</span><strong>${fmtKc(v)}</strong><small>${k}</small></div>`).join("");
  const okraj = `<tr><td><div class="tokraj"></div></td></tr>`;
  $("#tisk").className = jenGl ? "brand-gl" : "";
  $("#tisk").innerHTML = `<table class="tobal"><thead>${okraj}</thead><tfoot>${okraj}</tfoot><tbody><tr><td>
    <div class="tpruh"></div>
    <div class="thlava"><div class="tlogo">${jenGl ? LOGO_GL : LOGO_CC}</div><div class="tdatum">${new Date().toLocaleDateString("cs-CZ")}</div></div>
    <h1>${nadpisNaceneni()}</h1>
    ${podnadpisNaceneni() ? `<p class="tklient">${esc(podnadpisNaceneni())}</p>` : ""}
    ${state.cil ? `<p class="tcil"><strong>Cíl spolupráce.</strong> ${esc(state.cil)}</p>` : ""}
    ${jenGl ? `<p class="tglpozn">${GL_POZNAMKA}</p>` : ""}
    <div class="tprehled">${prehled}</div>
    ${obsah}
  </td></tr></tbody></table>`;
  window.print();
}

/* ── ukládání a sdílení ────────────────────────────────────────────────────── */
function nazevSouboru(predpona){
  const jmeno = (state.projekt || state.klient || "projekt").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return predpona + "-" + jmeno;
}
function projektData(){
  return {
    verze:11, klient:state.klient, projekt:state.projekt, cil:state.cil, typ:state.typ,
    nastaveni:state.nastaveni, acts:state.acts, vlastni:state.vlastni,
  };
}
function nacistData(d){
  const nast = Object.assign({}, CATALOG.nastaveni, d.nastaveni || {});
  // Soubory do verze 10 nesly jednu sazbu a komunikaci přímo v projektu.
  if(d.sazba) nast.cenovaSazba = Number(d.sazba);
  if(d.komunikace != null && !d.nastaveni) nast.komunikace = Number(d.komunikace);
  Object.assign(state, {
    klient:d.klient||"", projekt:d.projekt||"", cil:d.cil||"", typ:d.typ||null,
    nastaveni:nast, acts:d.acts||{}, vlastni:d.vlastni||{}, otevrene:{},
  });
  KATEGORIE.forEach(c => { if(pocetVybranych(c)) state.otevrene[c.id] = true; });
}
function ulozitSoubor(){
  stahni(nazevSouboru("aktivity") + ".json", JSON.stringify(projektData(), null, 2), "application/json");
}
function nacistSoubor(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try { nacistData(JSON.parse(ev.target.result)); state.view = "edit"; render(); toast("Projekt načten"); }
      catch(err){ toast("Soubor se nepodařilo načíst"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function stahni(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime + ";charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* Odkaz nese jen vybrané úkony, jméno klienta, ceníkovou sazbu a komunikaci.
   Formát: id:hodiny nebo id*počet~složitost, oddělené čárkou. */
function shareUrl(){
  const parts = [];
  KATEGORIE.forEach(c => c.activities.forEach(a => {
    const s = state.acts[a.id];
    if(!s || !s.sel) return;
    if(a.kind === "hours") parts.push(a.id + ":" + (Number(s.hours)||0));
    else parts.push(a.id + "*" + (Number(s.units)||0) + "~" + (s.cx||"standard").charAt(0));
  }));
  const q = new URLSearchParams();
  q.set("a", parts.join(","));
  q.set("m", [state.klient, state.nastaveni.cenovaSazba, state.nastaveni.komunikace].join("|"));
  return location.origin + location.pathname + "#" + q.toString();
}
function nacistZOdkazu(){
  if(!location.hash || location.hash.length < 3) return false;
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    const a = q.get("a"); if(!a) return false;
    const cxMap = {s:"simple", t:"standard", c:"complex"};
    a.split(",").forEach(p => {
      if(p.includes(":")){
        const [id,h] = p.split(":");
        state.acts[id] = {sel:true, hours:Number(h)||0};
      } else if(p.includes("*")){
        const [id,rest] = p.split("*");
        const [u,cx] = rest.split("~");
        state.acts[id] = {sel:true, units:Number(u)||0, cx:cxMap[cx]||"standard"};
      }
    });
    const m = (q.get("m")||"").split("|");
    state.klient = m[0] || "";
    if(m[1]) state.nastaveni.cenovaSazba = Number(m[1]);
    if(m[2]) state.nastaveni.komunikace = Number(m[2]);
    KATEGORIE.forEach(c => { if(pocetVybranych(c)) state.otevrene[c.id] = true; });
    state.view = "edit";
    return true;
  } catch(e){ return false; }
}

/* ── drobnosti ─────────────────────────────────────────────────────────────── */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

$("#b-home").onclick = () => { state.view = "home"; render(); window.scrollTo(0,0); };
nacistZOdkazu();
render();
</script>
