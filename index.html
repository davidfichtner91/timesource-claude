<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#EA406F; --orange:#FD5D47; --dark:#232323; --gray:#686868;
  --lightpink:#FFCCD5; --bgpink:#FDF3F6; --bg:#F5F5F5; --white:#fff;
  --grad:linear-gradient(120deg,#EA406F 0%,#FD5D47 100%);
  --radius:10px; --line:1px solid #e6e6e6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Poppins','Segoe UI Variant','Segoe UI',sans-serif;color:var(--dark);background:var(--bg);font-size:15px;line-height:1.55}
h1,h2,h3{font-weight:700;margin:0 0 .4em}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:16px;font-weight:600}
a{color:var(--pink)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

header{background:var(--grad);color:#fff;padding:22px 0}
header .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{color:#fff;margin:0;font-size:22px;letter-spacing:.2px}
header .sub{color:#fff;opacity:.9;font-size:13px}
.langs{display:flex;gap:6px}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.langs button.on{background:#fff;color:var(--pink);border-color:#fff;font-weight:600}

.card{background:#fff;border:var(--line);border-radius:var(--radius);padding:20px;margin:18px 0}
.card.tight{padding:14px 18px}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--gray)}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font:inherit;background:#fff;color:var(--dark)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lightpink);border-color:var(--pink)}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.hint{font-size:12px;color:var(--gray);margin-top:4px}

.btn{background:var(--pink);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#D63A60}
.btn.ghost{background:#fff;color:var(--dark);border:1px solid #ddd;font-weight:400}
.btn.ghost:hover{border-color:var(--pink);color:var(--pink);background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.bar .spacer{flex:1}

.phase{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
.ph-before{background:#FFF4E5;color:#8a5a00;border-color:#ffe0b2}
.ph-during{background:#E8F1FF;color:#134a99;border-color:#c9ddff}
.ph-adhoc{background:#EAF7EE;color:#1d6b38;border-color:#c9e9d4}
.ph-after{background:#F0ECF9;color:#4a3a7a;border-color:#ddd4f0}
.role{font-size:11px;color:var(--gray);border:1px solid #e6e6e6;border-radius:99px;padding:1px 7px}

.catlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick{display:flex;gap:10px;align-items:flex-start;border:1px solid #e6e6e6;border-radius:var(--radius);padding:12px;cursor:pointer;background:#fff}
.catpick.on{border-color:var(--pink);background:var(--bgpink)}
.catpick input{margin-top:3px}
.catpick .n{font-weight:600}
.catpick .d{font-size:12px;color:var(--gray)}

.act{border-top:var(--line);padding:14px 0}
.act:first-child{border-top:0}
.act .head{display:flex;gap:10px;align-items:flex-start}
.act .head input[type=checkbox]{margin-top:5px;width:16px;height:16px;accent-color:var(--pink)}
.act .name{font-weight:600;flex:1}
.act .tip{font-size:12.5px;color:var(--gray);margin:2px 0 0}
.act .ctl{margin:10px 0 0 26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act .ctl input[type=number]{width:92px}
.act .ctl select{width:auto;min-width:200px}
.presets{display:flex;gap:6px}
.presets button{border:1px solid #ddd;background:#fff;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.presets button:hover{border-color:var(--pink);color:var(--pink)}
.rng{font-size:12px;color:var(--gray)}
.sum{margin-left:auto;font-weight:600;white-space:nowrap}

table{width:100%;border-collapse:collapse;margin:10px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:var(--line);font-size:14px}
th{font-size:12px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-top:2px solid var(--dark);border-bottom:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.tile{border:var(--line);border-radius:var(--radius);padding:14px;background:#fff}
.tile .k{font-size:12px;color:var(--gray)}
.tile .v{font-size:22px;font-weight:700;margin-top:2px}
.tile .m{font-size:12px;color:var(--gray)}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.steps span{font-size:11px;padding:3px 9px;border-radius:99px;background:#ececec;color:var(--gray)}
.steps span.on{background:var(--pink);color:#fff;font-weight:600}
.steps span.done{background:var(--lightpink);color:#8A2344}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;
  padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--gray)}
.share{width:100%;font-size:12px;font-family:ui-monospace,Consolas,monospace}
details summary{cursor:pointer;font-weight:600;font-size:14px}

@media (max-width:700px){
  .grid2,.catlist{grid-template-columns:1fr}
  .act .sum{margin-left:26px}
}
@media print{
  header{background:none;color:var(--dark);border-bottom:3px solid var(--pink)}
  header h1,header .sub{color:var(--dark)}
  .langs,.bar,.steps,.noprint{display:none !important}
  body{background:#fff;font-size:12px}
  .card{break-inside:avoid;border-color:#ccc;margin:10px 0}
}
</style>
</head>
<body>

  <div class="wrap">

      <div class="sub" id="hsub"></div>

</header>

<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="view"></div>
</div>

/* ── stav ──────────────────────────────────────────────────────────────────── */
const state = {
  lang:"cs", step:0,
  klient:"", projekt:"", cil:"",
  sazba:"", komunikace:20,
  kategorie:{},          // id -> true/false
  acts:{},               // id -> {sel,hours,units,cx}
  vlastni:{},            // katId -> [{id,name,hours,role}]
};

const $ = s => document.querySelector(s);
const t = k => (T[state.lang] && T[state.lang][k]) || T.cs[k] || k;
const L = o => (o && (o[state.lang] || o.cs)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtH(h){
  if(!h) return "0";
  const v = Math.round(h*10)/10;
  const s = v % 1 === 0 ? String(v) : v.toFixed(1);
  return state.lang === "cs" ? s.replace(".", ",") : s;
}
function fmtKc(n){
  return Math.round(n).toLocaleString("cs-CZ") + " Kč";
}
function dny(h){
  const d = h/8;
  const s = fmtH(d);
  return s + " " + (Math.abs(d-1) < 0.05 ? t("pracDen") : t("pracDnu"));
}

/* ── katalog: pomocné ──────────────────────────────────────────────────────── */
const KATEGORIE = CATALOG.kategorie;
const FAZE = CATALOG.faze;
const fazeNazev = id => { const f = FAZE.find(x=>x.id===id); return f ? (f[state.lang]||f.cs) : id; };
const katById = id => KATEGORIE.find(c=>c.id===id);

function aktivniKategorie(){
  const vybrano = KATEGORIE.filter(c => state.kategorie[c.id]);
  return vybrano.length ? vybrano : [];
}

function actState(id){
  if(!state.acts[id]) state.acts[id] = {sel:false};
  return state.acts[id];
}

function hodinyUkonu(act){
  const s = state.acts[act.id];
  if(!s || !s.sel) return 0;
  if(act.kind === "hours") return Number(s.hours) || 0;
  const cx = act.complexity && act.complexity[s.cx || "standard"];
  const per = cx ? cx.hoursPerUnit : 0;
  return (Number(s.units) || 0) * per;
}
function hodinyVlastnich(katId){
  return (state.vlastni[katId] || []).reduce((a,v)=>a + (Number(v.hours)||0), 0);
}
function hodinyKategorie(kat){
  return kat.activities.reduce((a,x)=>a+hodinyUkonu(x),0) + hodinyVlastnich(kat.id);
}
function hodinyFaze(faze){
  return KATEGORIE.filter(c=>c.phase===faze).reduce((a,c)=>a+hodinyKategorie(c),0);
}
function hodinyRole(role){
  let sum = 0;
  KATEGORIE.forEach(c => c.activities.forEach(a => { if(a.role===role) sum += hodinyUkonu(a); }));
  KATEGORIE.forEach(c => (state.vlastni[c.id]||[]).forEach(v => { if((v.role||"specialista")===role) sum += Number(v.hours)||0; }));
  return sum;
}
function hodinyKomunikace(){
  const pct = Number(state.komunikace) || 0;
  return hodinyRole("specialista") * pct / 100;
}
function celkem(){
  return FAZE.reduce((a,f)=>a+hodinyFaze(f.id),0) + hodinyKomunikace();
}

/* ── vykreslení ────────────────────────────────────────────────────────────── */
function render(){
  $("#hsub").textContent = t("sub");
  renderLangs();
  renderSteps();
  const kats = aktivniKategorie();
  if(state.step === 0) viewZadani();
  else if(state.step <= kats.length) viewKategorie(kats[state.step-1]);
  else viewSouhrn();
  // Nahoru se skáče jen při změně kroku. Zaškrtnutí úkonu překresluje stránku taky,
  // a bez téhle podmínky by uprostřed dlouhé kategorie odhodilo čtenáře na začátek.
  if(posledniKrok !== state.step){ window.scrollTo({top:0,behavior:"instant"}); posledniKrok = state.step; }
}
let posledniKrok = null;

function renderLangs(){
  $("#langs").innerHTML = ["cs","en","de"].map(l =>
    `<button class="${l===state.lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("#langs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { state.lang = b.dataset.l; render(); });
}

function renderSteps(){
  const kats = aktivniKategorie();
  if(!kats.length){ $("#steps").innerHTML = ""; return; }
  const items = [t("zadani"), ...kats.map(c=>L(c.name)), t("souhrn")];
  $("#steps").innerHTML = items.map((n,i) =>
    `<span class="${i===state.step?"on":i<state.step?"done":""}" data-i="${i}">${esc(n)}</span>`).join("");
  $("#steps").querySelectorAll("span").forEach(s =>
    s.onclick = () => { state.step = Number(s.dataset.i); render(); });
}

  $("#view").innerHTML = `
    <div class="card">

      <div class="grid2">

        </div>
        <div>

          <input type="text" id="i-projekt" placeholder="${esc(t("projektPh"))}" value="${esc(state.projekt)}">
        </div>
      </div>
      <div class="hint">${t("projektHint")}</div>
      <label class="f">${t("cil")}</label>
      <textarea id="i-cil" placeholder="${esc(t("cilPh"))}">${esc(state.cil)}</textarea>
      <div class="grid2">
        <div>
          <label class="f">${t("sazba")}</label>
          <input type="number" id="i-sazba" min="0" step="50" value="${state.sazba}">
          <div class="hint">${t("sazbaHint")}</div>
        </div>
        <div>
          <label class="f">${t("komunikaceIn")}</label>
          <input type="number" id="i-kom" min="0" max="50" step="5" value="${state.komunikace}">
          <div class="hint">${t("komunikaceHint")}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>${t("vyber")}</h2>
      <div class="hint" style="margin-bottom:12px">${t("vyberHint")}</div>
      <div class="catlist">${kats}</div>

    <div class="bar">

  $("#i-klient").oninput = e => state.klient = e.target.value;

  $("#i-sazba").oninput = e => state.sazba = e.target.value;

/* kroky kategorií */
function viewKategorie(kat){
  const kats = aktivniKategorie();
  const idx = kats.indexOf(kat) + 1;
  const akt = kat.activities.map(a => radekUkonu(a)).join("");
  const vl = (state.vlastni[kat.id]||[]).map((v,i) => `
    <div class="act">
      <div class="head">
        <input type="checkbox" checked disabled>
        <div class="name">${esc(v.name)} <span class="role">${esc(t(v.role||"specialista"))}</span></div>
        <div class="sum">${fmtH(v.hours)} ${t("hodin")}</div>
      </div>
      <div class="ctl">
        <input type="number" min="0" step="0.5" value="${v.hours}" data-vl="${kat.id}" data-i="${i}">
        <button class="btn ghost" data-vldel="${kat.id}" data-i="${i}">×</button>
      </div>
    </div>`).join("");

  $("#view").innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">${esc(L(kat.name))}</h2>
        <span class="phase ph-${kat.phase}">${esc(fazeNazev(kat.phase))}</span>
        <span class="muted" style="font-size:13px">${t("krok")} ${idx} ${t("z")} ${kats.length}</span>
      </div>
      <p class="muted" style="font-size:13.5px;margin:6px 0 4px">${esc(L(kat.description))}</p>
    </div>
    <div class="card">${akt}${vl}
      <div style="border-top:var(--line);padding-top:12px;margin-top:6px;display:flex;justify-content:space-between;align-items:center">
        <button class="btn ghost" id="b-vlastni">+ ${t("vlastni")}</button>
        <div><span class="muted">${t("soucetKat")}</span> <strong>${fmtH(hodinyKategorie(kat))} ${t("hodin")}</strong></div>
      </div>
    </div>
    <div class="bar">
      <button class="btn ghost" id="b-zpet">${t("zpet")}</button>
      <div class="spacer"></div>
      <button class="btn" id="b-dal">${idx===kats.length ? t("souhrn") : t("dal")}</button>
    </div>`;

  vazbyUkonu(kat);
  $("#b-zpet").onclick = () => { state.step--; render(); };
  $("#b-dal").onclick = () => { state.step++; render(); };
  $("#b-vlastni").onclick = () => {
    const n = prompt(t("nazevUkonu"));
    if(!n) return;
    (state.vlastni[kat.id] = state.vlastni[kat.id] || []).push({name:n, hours:1, role:"specialista"});
    render();
  };
}

function radekUkonu(a){
  const s = actState(a.id);
  const on = s.sel;
  let ctl = "";
  if(on && a.kind === "hours"){
    const p = [a.minHours, a.avgHours, a.maxHours].filter((v,i,arr)=>v!=null && arr.indexOf(v)===i);
    ctl = `<div class="ctl">
      <input type="number" min="0" step="0.5" value="${s.hours ?? a.avgHours ?? 1}" data-h="${a.id}">
      <span class="muted">${t("hodin")}</span>
      <span class="presets">${p.map(v=>`<button data-p="${a.id}" data-v="${v}">${fmtH(v)}</button>`).join("")}</span>
      <span class="rng">${fmtH(a.minHours)} ${String.fromCharCode(8211)} ${fmtH(a.maxHours)} ${t("hodin")}</span>
    </div>`;
  } else if(on && a.kind === "units"){
    const opts = Object.keys(a.complexity||{}).map(k =>
      `<option value="${k}" ${(s.cx||"standard")===k?"selected":""}>${esc(L(a.complexity[k].label))} (${fmtH(a.complexity[k].hoursPerUnit)} ${t("hodin")})</option>`).join("");
    ctl = `<div class="ctl">
      <input type="number" min="0" step="1" value="${s.units ?? 1}" data-u="${a.id}">
      <span class="muted">${esc(L(a.unitLabel)||t("jednotek"))}</span>
      <select data-c="${a.id}">${opts}</select>
    </div>`;
  }
  return `<div class="act">
    <div class="head">
      <input type="checkbox" data-s="${a.id}" ${on?"checked":""}>
      <div class="name">${esc(L(a.name))} <span class="role">${esc(t(a.role))}</span>
        <p class="tip">${esc(L(a.tooltip))}</p>
      </div>
      <div class="sum">${on ? fmtH(hodinyUkonu(a)) + " " + t("hodin") : ""}</div>
    </div>${ctl}</div>`;
}

function vazbyUkonu(kat){
  const v = $("#view");
  v.querySelectorAll("[data-s]").forEach(cb => cb.onchange = () => {
    const a = kat.activities.find(x=>x.id===cb.dataset.s);
    const s = actState(a.id);
    s.sel = cb.checked;
    if(s.sel){
      if(a.kind === "hours" && s.hours == null) s.hours = a.avgHours ?? 1;
      if(a.kind === "units"){ if(s.units == null) s.units = 1; if(!s.cx) s.cx = "standard"; }
    }
    render();
  });
  v.querySelectorAll("[data-h]").forEach(i => i.onchange = () => { actState(i.dataset.h).hours = Number(i.value)||0; render(); });
  v.querySelectorAll("[data-u]").forEach(i => i.onchange = () => { actState(i.dataset.u).units = Number(i.value)||0; render(); });
  v.querySelectorAll("[data-c]").forEach(sel => sel.onchange = () => { actState(sel.dataset.c).cx = sel.value; render(); });
  v.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { actState(b.dataset.p).hours = Number(b.dataset.v); render(); });
  v.querySelectorAll("[data-vl]").forEach(i => i.onchange = () => {
    state.vlastni[i.dataset.vl][Number(i.dataset.i)].hours = Number(i.value)||0; render(); });
  v.querySelectorAll("[data-vldel]").forEach(b => b.onclick = () => {
    state.vlastni[b.dataset.vldel].splice(Number(b.dataset.i),1); render(); });
}

/* ── ukládání a sdílení ────────────────────────────────────────────────────── */
function projektData(){
  return {
    verze:9, lang:state.lang, klient:state.klient, projekt:state.projekt, cil:state.cil,
    sazba:state.sazba, komunikace:state.komunikace,
    kategorie:state.kategorie, acts:state.acts, vlastni:state.vlastni,
  };
}
function nacistData(d){
  Object.assign(state, {
    lang:d.lang||"cs", klient:d.klient||"", projekt:d.projekt||"", cil:d.cil||"",
    sazba:d.sazba??"", komunikace:d.komunikace??20,
    kategorie:d.kategorie||{}, acts:d.acts||{}, vlastni:d.vlastni||{},
  });
}

function ulozitSoubor(){
  const jmeno = (state.projekt || state.klient || "time-source").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  stahni("time-source-" + jmeno + ".json", JSON.stringify(projektData(), null, 2), "application/json");
}
function nacistSoubor(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try { nacistData(JSON.parse(ev.target.result)); state.step = 0; render(); toast(t("nacteno")); }
      catch(err){ toast(t("chybaSouboru")); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function stahni(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime + ";charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* Krátký odkaz: jen vybrané úkony, bez loga a bez poznámek.
   Formát: id:hodiny nebo id*počet~složitost, oddělené tečkou a čárkou. */
function shareUrl(){
  const parts = [];
  KATEGORIE.forEach(c => c.activities.forEach(a => {
    const s = state.acts[a.id];
    if(!s || !s.sel) return;
    if(a.kind === "hours") parts.push(a.id + ":" + (Number(s.hours)||0));
    else parts.push(a.id + "*" + (Number(s.units)||0) + "~" + (s.cx||"standard").charAt(0));
  }));
  const meta = [state.klient, state.sazba, state.komunikace].join("|");
  const q = new URLSearchParams();
  q.set("a", parts.join(","));
  if(meta.replace(/\|/g,"")) q.set("m", meta);
  return location.origin + location.pathname + "#" + q.toString();
}
function nacistZOdkazu(){
  if(!location.hash || location.hash.length < 3) return false;
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    const a = q.get("a"); if(!a) return false;
    const cxMap = {s:"simple", t:"standard", c:"complex"};
    a.split(",").forEach(p => {
      if(p.includes(":")){
        const [id,h] = p.split(":");
        state.acts[id] = {sel:true, hours:Number(h)||0};
      } else if(p.includes("*")){
        const [id,rest] = p.split("*");
        const [u,cx] = rest.split("~");
        state.acts[id] = {sel:true, units:Number(u)||0, cx:cxMap[cx]||"standard"};
      }
    });
    const m = (q.get("m")||"").split("|");
    state.klient = m[0]||""; state.sazba = m[1]||""; state.komunikace = m[2]||20;
    KATEGORIE.forEach(c => {
      if(c.activities.some(x => state.acts[x.id] && state.acts[x.id].sel)) state.kategorie[c.id] = true;
    });
    state.step = KATEGORIE.filter(c=>state.kategorie[c.id]).length + 1;
    return true;
  } catch(e){ return false; }
}

/* ── export do naceneni.md ─────────────────────────────────────────────────── */
function exportMd(){
  const sazba = Number(state.sazba) || 0;
  const dnes = new Date().toISOString().slice(0,10);
  const l = [];
  l.push("# Nacenění: " + (state.klient || "klient") + (state.projekt ? ", " + state.projekt : ""));
  l.push("");
  l.push("Odhad vznikl v Time Source " + dnes + ". Hodiny jsou odhad, ne závazek.");
  l.push("");
  if(state.cil){ l.push("**Cíl spolupráce.** " + state.cil); l.push(""); }

  FAZE.forEach(f => {
    const kats = KATEGORIE.filter(c => c.phase === f.id && hodinyKategorie(c) > 0);
    if(!kats.length) return;
    l.push("## " + (f.cs));
    l.push("");
    l.push(sazba ? "| Úkon | Role | Hodiny | Cena |" : "| Úkon | Role | Hodiny |");
    l.push(sazba ? "|---|---|---:|---:|" : "|---|---|---:|");
    kats.forEach(c => {
      c.activities.forEach(a => {
        const h = hodinyUkonu(a);
        if(!h) return;
        const r = a.role === "account" ? "account" : "specialista";
        l.push("| " + a.name.cs + " | " + r + " | " + fmtH(h) + " | " + (sazba ? fmtKc(h*sazba) + " |" : ""));
      });
      (state.vlastni[c.id]||[]).forEach(v => {
        l.push("| " + v.name + " | " + (v.role||"specialista") + " | " + fmtH(v.hours) + " | " + (sazba ? fmtKc(v.hours*sazba) + " |" : ""));
      });
    });
    const sum = kats.reduce((a,c)=>a+hodinyKategorie(c),0);
    l.push(sazba
      ? "| **" + f.cs + " celkem** | | **" + fmtH(sum) + "** | **" + fmtKc(sum*sazba) + "** |"
      : "| **" + f.cs + " celkem** | | **" + fmtH(sum) + "** |");
    l.push("");
  });

  const kom = hodinyKomunikace();
  if(kom){
    l.push("## Komunikace a schvalování");
    l.push("");
    l.push("Připočteno " + state.komunikace + " % z hodin specialisty, tedy " + fmtH(kom) + " h"
      + (sazba ? " (" + fmtKc(kom*sazba) + ")" : "") + ". Zahrnuje hovory, schvalovací kola a zápisy.");
    l.push("");
  }

  const tot = celkem();
  l.push("## Celkem");
  l.push("");
  l.push("| | Hodiny | Pracovních dnů |" + (sazba ? " Cena |" : ""));
  l.push("|---|---:|---:|" + (sazba ? "---:|" : ""));
  const rows = [["Jednorázově", hodinyFaze("before")+hodinyFaze("adhoc")+hodinyFaze("after")],
                ["Měsíčně", hodinyFaze("during")], ["Celkem", tot]];
  rows.forEach(([n,h]) => l.push("| " + n + " | " + fmtH(h) + " | " + fmtH(h/8) + " |" + (sazba ? " " + fmtKc(h*sazba) + " |" : "")));
  l.push("");
  l.push("Sazba " + (sazba ? sazba.toLocaleString("cs-CZ") + " Kč/hod" : "není v dokumentu uvedená") + ".");
  l.push("");

  stahni("naceneni.md", l.join("\n"), "text/markdown");
}

/* ── drobnosti ─────────────────────────────────────────────────────────────── */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

nacistZOdkazu();
render();
</script>
